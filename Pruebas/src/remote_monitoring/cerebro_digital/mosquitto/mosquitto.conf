# Mosquitto MQTT Broker — Cerebro Digital CIDESI
# Configuración básica para red local (Jetson ↔ Windows)

# ── Listener principal (sin TLS, red local confiable) ──
listener 1883
allow_anonymous true
protocol mqtt

# ── WebSocket (opcional, para debug desde browser) ──
listener 9001
protocol websockets

# ── Persistencia ──
persistence true
persistence_location /mosquitto/data/

# ── Logs ──
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error
log_type notice
